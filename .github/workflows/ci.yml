name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cargo-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GTK development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libadwaita-1-dev
      - name: Check Rust project
        run: cargo check
      - name: Audit dependencies, licenses, and advisories
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check
          arguments: --all-features
      - name: Run Rust tests
        run: cargo test --all-targets
