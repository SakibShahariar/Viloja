name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cargo-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GTK development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libadwaita-1-dev
      - name: Check Rust project
        run: cargo check
